# Airflow orchestration for the Supply Chain Logistics Pipeline.
#
#   One-off end-to-end DAG run (the evidence command):
#       docker compose -f docker/docker-compose.yml run --rm airflow-test
#
#   Full Airflow UI at http://localhost:8080 (login: admin / admin):
#       docker compose -f docker/docker-compose.yml up airflow-standalone
#
# Both services mount the repo at /opt/project, so the DAG executes the same
# src/ modules the native pipeline uses and writes back into the host's data/
# and docs/ directories.
#
# Run only ONE of them at a time. They write the same data/ files, and two
# concurrent runs collide on the SQLite raw store ("database is locked"). If
# airflow-standalone is up with the DAG unpaused, its scheduler may start a
# scheduled run on its own -- pause the DAG in the UI, or stop the service,
# before using airflow-test.

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    PYTHONPATH: /opt/project
  volumes:
    - ..:/opt/project

services:
  # Synchronous single run. Exits non-zero if any task fails.
  #
  # Uses its OWN metadata volume, separate from airflow-standalone. Sharing one
  # would let the standalone scheduler pick up this run's queued tasks and
  # execute them concurrently -- two processes writing the same bind-mounted
  # SQLite file, which fails with "database is locked".
  airflow-test:
    <<: *common
    entrypoint: ["/bin/bash", "/opt/project/docker/run_dag_test.sh"]
    volumes:
      - ..:/opt/project
      - airflow-db-test:/opt/airflow

  # Scheduler + webserver + UI.
  airflow-standalone:
    <<: *common
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        python -m src.ingestion.shipping_api_server > /tmp/api.log 2>&1 &
        airflow standalone &
        STANDALONE_PID=$$!
        # `airflow standalone` creates its own admin user with a RANDOM
        # password (it ignores _AIRFLOW_WWW_USER_*, which only the official
        # docker-compose entrypoint honours). Wait for that user to exist,
        # then force the password to a known value so the documented
        # admin/admin credentials actually work.
        until airflow users list 2>/dev/null | grep -q admin; do sleep 5; done
        airflow users reset-password --username admin --password admin || true
        echo "=== Airflow UI ready at http://localhost:8080 (admin / admin) ==="
        wait $$STANDALONE_PID
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      PYTHONPATH: /opt/project
    volumes:
      - ..:/opt/project
      - airflow-db:/opt/airflow
    ports:
      - "8080:8080"

volumes:
  airflow-db:        # airflow-standalone (UI)
  airflow-db-test:   # airflow-test (one-off runs)
